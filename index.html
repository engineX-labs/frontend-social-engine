    <style>
      /* Pantalla de arranque: se ve mientras cargan el código y los datos; React la reemplaza. */
      html {
        background: #f4f4f2;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background: #0e1116;
        }
      }
      .arranque {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #0e1116;
      }
      @media (prefers-color-scheme: dark) {
        .arranque {
          color: #f4f4f2;
        }
      }
      .arranque svg {
        width: 44px;
        height: 44px;
        animation: arranque 1.4s cubic-bezier(0.2, 0.7, 0.2, 1) infinite;
      }
      @keyframes arranque {
        50% {
          opacity: 0.45;
          transform: scale(0.94);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .arranque svg {
          animation: none;
        }
      }
    </style>
  </head>

    <div id="root">

        <svg viewBox="0 0 16 16" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
